[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-paper-studio"
version = "0.1.0"
description = "Windows 数模论文工作台"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.8.2.1", "PySide6-Fluent-Widgets==1.11.3", "PySideSix-Frameless-Window==0.8.2", "darkdetect==0.8.0", "pywin32==312; sys_platform == 'win32'", "openpyxl==3.1.5", "defusedxml==0.7.1", "et-xmlfile==2.0.0", "pypdf==6.21.1"]

[project.scripts]
mathmodel-paper-studio = "mathmodel_paper_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.optional-dependencies]
release = ["PyInstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]
test = ["pytest==9.0.2", "pytest-cov==7.0.0", "coverage==7.16.2", "python-docx==1.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["mathmodel_paper_studio"]
parallel = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
